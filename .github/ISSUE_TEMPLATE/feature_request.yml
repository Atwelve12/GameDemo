name: Feature Request
description: 提议新功能或体验改进
title: "[Feature] "
body:
  - type: textarea
    id: background
    attributes:
      label: 需求背景
      description: 当前遇到了什么问题，为什么需要这个功能？
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: 使用场景
      description: 请描述具体的用户和使用场景
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 请说明期望的功能和交互方式
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备注
      description: 这里可以放一些其他描述
